import = ["~/.cache/theme/alacritty-colors.toml"]

[env]
WINIT_UNIX_BACKEND = "wayland"

[window]
padding = { x = 12, y = 12 }
opacity = 0.95
decorations = "None"

[font]
size = 13.0

[font.normal]
family = "JetBrainsMono Nerd Font"

[scrolling]
history = 10000

[general]
live_config_reload = true

[cursor.style]
shape = "Beam"
blinking = "On"

[selection]
save_to_clipboard = true
